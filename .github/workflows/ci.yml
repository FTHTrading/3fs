name: CI
on: { push: { branches: [main, 'cycle*'] }, pull_request: { branches: [main] } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: npm run check
      - run: npm test
